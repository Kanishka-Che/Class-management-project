name: Build and deploy to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Trust deployment server
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host deployment-server
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            ServerAliveInterval 30
            ServerAliveCountMax 120
            ConnectTimeout 30
          EOF

      - name: Upload source and deployment configuration
        run: |
          ssh deployment-server "mkdir -p '${{ secrets.DEPLOY_PATH }}'"
          tar --exclude=.git -czf - . | ssh deployment-server "tar -xzf - -C '${{ secrets.DEPLOY_PATH }}'"
          ssh deployment-server "cat > '${{ secrets.DEPLOY_PATH }}/.env'" <<'EOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          INITIAL_ADMIN_PASSWORD=${{ secrets.INITIAL_ADMIN_PASSWORD }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          EOF

      - name: Build and restart services
        run: |
          ssh deployment-server \
            "cd '${{ secrets.DEPLOY_PATH }}' && docker compose build --pull && docker compose up -d --remove-orphans && docker compose ps"
