services:
  postgres-db:
    image: postgres:15-alpine
    container_name: zriolabs_db
    restart: always
    environment:
      POSTGRES_USER: zrio_admin
      POSTGRES_PASSWORD: StrongPassword123
      POSTGRES_DB: zriolabs_cms
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend-api:
    build: ./ClassManagement.Api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=zriolabs_cms;Username=zrio_admin;Password=StrongPassword123
      - Jwt__Key=YourSuperSecretAndVeryLongJwtKeyHere123456789!
      - Jwt__Issuer=ZrioLabs
      - Jwt__Audience=ZrioLabsUsers
      - Jwt__ExpireMinutes=60
      - ASPNETCORE_ENVIRONMENT=Production
      - InitialAdmin__Username=admin
      - InitialAdmin__Password=123456
    depends_on:
      - postgres-db

  frontend-app:
    build: ./class-management-system
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://150.230.137.23:5000

volumes:
  postgres_data: