services:
  postgres-db:
    image: postgres:15-alpine
    container_name: zriolabs_db
    restart: always
    environment:
      POSTGRES_USER: zrio_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: zriolabs_cms
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend-api:
    build: ./ClassManagement.Api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=zriolabs_cms;Username=zrio_admin;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - Jwt__Key=${JWT_KEY:?JWT_KEY is required}
      - Jwt__Issuer=ZrioLabs
      - Jwt__Audience=ZrioLabsUsers
      - Jwt__ExpireMinutes=60
      - ASPNETCORE_ENVIRONMENT=Production
      - InitialAdmin__Username=admin
      - InitialAdmin__Password=${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
    depends_on:
      - postgres-db

  frontend-app:
    build:
      context: ./class-management-system
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: always
    ports:
      - "3000:3000"

volumes:
  postgres_data:
